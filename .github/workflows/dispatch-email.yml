name: Dispatch Email Campaigns

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "*/5 * * * *"  # Disabled - uncomment to enable automated runs

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatcher
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST "${{ secrets.DISPATCH_URL }}" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" || exit 1
